[project]
name = "entrega-7"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diegofziegler", email = "diego.f.ziegler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langgraph>=1.2.14",
    "phoenix>=0.9.1",
    "pinecone-client>=6.0.0",
