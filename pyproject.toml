[project]
name = "entrega-7"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diegofziegler", email = "diego.f.ziegler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=20.21.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.14",
    "openinference-instrumentation-langchain>=0.1.79",
    "opentelemetry-exporter-otlp>=1.45.1",
    "pinecone>=10.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
entrega-7 = "entrega_7:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
